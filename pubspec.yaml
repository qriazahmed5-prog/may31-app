name: may31
description: "P2P WebRTC Chat & Media App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.0.1
  flutter_webrtc: 0.11.6+hotfix.1
  file_picker: ^8.0.0
  image_picker: ^1.1.1
  permission_handler: ^11.3.1
  audioplayers: ^5.2.1
  path_provider: ^2.1.1
  record: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/iphone.mp3
    - assets/sounds/nokia.mp3
